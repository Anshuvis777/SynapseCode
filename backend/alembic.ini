[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Use DATABASE_URL_SYNC from env (psycopg2 — Alembic needs sync driver)
sqlalchemy.url = postgresql+psycopg2://devassist:devassist_secret@localhost:5432/devassist_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
