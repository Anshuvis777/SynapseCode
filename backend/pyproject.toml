[project]
name = "devassist-ai"
version = "0.1.0"
description = "AI-powered developer assistant that understands software repositories"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # Redis
    "redis>=5.0.0",

    # Vector database
    "qdrant-client>=1.9.0",

    # LLM & Embeddings
    "openai>=1.30.0",
    "tiktoken>=0.7.0",
    "fastembed>=0.3.0",

    # Background tasks
    "celery[redis]>=5.4.0",

    # Auth & Security
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",

    # Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.0.0",

    # Logging
    "structlog>=24.1.0",

    # Parsing
    "tree-sitter>=0.22.0",

    # Utilities
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",

    # Document Parsers
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
